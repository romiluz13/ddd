# DDD Knowledge Map
# Initialized by: ddd-book skill (dogfooding)
# Maps relevant engineering domains to evidence, gaps, and applicability.

schema_version: 0.1.0

domains:
  - id: agent-skills-spec
    name: "Agent Skills Specification"
    trigger: "SKILL.md format, frontmatter, directory structure, progressive disclosure"
    questions:
      - "Does the SKILL.md frontmatter conform to agentskills.io spec?"
      - "Are skills under 500 lines?"
      - "Should detailed reference material be split into references/?"
      - "Are name fields matching directory names?"
    expected_decisions: ["Reference file extraction", "Progressive disclosure optimization"]
    authority_type: external-spec
    confidence: high
    risk_if_omitted: "Skills rejected by skills.sh CLI or not discovered by agents"
    evidence: [EL-001, EL-002]
    gaps: []

  - id: skills-packaging
    name: "Skills Packaging and Distribution"
    trigger: "skills.sh.json, README, repo structure, npx skills add"
    questions:
      - "Is skills.sh.json correctly structured?"
      - "Are groupings accurate?"
      - "Is the repo discoverable on skills.sh?"
    expected_decisions: ["Registry grouping", "Publishing workflow"]
    authority_type: external-tool
    confidence: high
    risk_if_omitted: "Skills not discoverable or installable"
    evidence: []
    gaps: []

  - id: ddd-methodology
    name: "DDD Methodology"
    trigger: "Any change to SPEC.md or skill definitions"
    questions:
      - "Do skills accurately implement the spec?"
      - "Are there spec sections not covered by any skill?"
      - "Is the machine API complete?"
      - "Are artifact schemas consistent between spec and skills?"
    expected_decisions: ["Skill-spec alignment", "Coverage gaps"]
    authority_type: project-spec
    confidence: high
    risk_if_omitted: "Skills diverge from spec, methodology breaks"
    evidence: [SPEC]
    gaps:
      - "No formal cross-check between skill content and spec sections"

  - id: yaml-schema-design
    name: "YAML Schema Design"
    trigger: "Artifact schemas in SPEC.md, template files in .ddd/"
    questions:
      - "Are all YAML schemas in SPEC.md valid?"
      - "Do template files match normative schemas?"
      - "Are schema_version fields consistent?"
    expected_decisions: ["Schema validation", "Template alignment"]
    authority_type: project-spec
    confidence: high
    risk_if_omitted: "Invalid YAML, broken artifact parsing"
    evidence: [SPEC]
    gaps: []

  - id: technical-writing
    name: "Technical Writing for Agents"
    trigger: "SKILL.md content quality, instruction clarity"
    questions:
      - "Are instructions actionable for an AI agent?"
      - "Is progressive disclosure used effectively?"
      - "Are edge cases covered?"
      - "Do descriptions contain activation keywords?"
    expected_decisions: ["Content optimization", "Reference extraction"]
    authority_type: best-practice
    confidence: medium
    risk_if_omitted: "Skills don't activate or execute correctly"
    evidence: []
    gaps:
      - "No reference files for any skill (all content inline)"

  - id: stack-detection
    name: "Stack Detection and Project Context"
    trigger: "New project initialization, dependency changes, framework upgrades"
    questions:
      - "Is the detected stack accurate and version-matched?"
      - "Are all dependencies enumerated with installed versions?"
      - "Are cross-document constraints identified?"
    expected_decisions: ["Project context initialization", "Dependency evidence acquisition"]
    authority_type: project-spec
    confidence: high
    risk_if_omitted: "Evidence lock entries for wrong versions, hallucinated API usage"
    evidence: [SPEC]
    gaps: []

  - id: domain-modeling
    name: "Domain Modeling (State Machines, Aggregates, Threat Models)"
    trigger: "Behavioral claims, state transitions, invariant protection, security boundaries"
    questions:
      - "Are state machine models complete for all stateful entities?"
      - "Are aggregate boundaries correctly identified?"
      - "Are threat models present for security-relevant components?"
    expected_decisions: ["Model creation", "Passport refinement"]
    authority_type: project-spec
    confidence: high
    risk_if_omitted: "Unmodeled state transitions, missing invariants, security blind spots"
    evidence: [SPEC]
    gaps: []

  - id: brownfield-audit
    name: "Brownfield Code Audit"
    trigger: "Adopting DDD on existing codebase, legacy code integration"
    questions:
      - "What implicit claims does existing code make?"
      - "Which claims have matching evidence?"
      - "Which claims are unsupported?"
    expected_decisions: ["Remediation prioritization", "Draft Book creation"]
    authority_type: project-spec
    confidence: high
    risk_if_omitted: "Adoption friction, unknown gaps in legacy code"
    evidence: [SPEC]
    gaps: []

  - id: dependency-management
    name: "Dependency Enumeration and Version Matching"
    trigger: "package.json changes, lockfile updates, new imports"
    questions:
      - "Does every dependency have version-matched evidence?"
      - "Are peer dependency conflicts detected?"
      - "Are cross-document constraints between dependencies recorded?"
    expected_decisions: ["Evidence acquisition", "Constraint recording"]
    authority_type: project-spec
    confidence: high
    risk_if_omitted: "Agent uses wrong API version, hallucinates deprecated methods"
    package: null
    installed_version: null
    evidence: []
    gaps: []

  - id: citation-entailment
    name: "Citation Entailment Verification"
    trigger: "Compliance sweep, adversarial review, any claim verification"
    questions:
      - "Does the cited source actually entail the claim?"
      - "Is the entailment explicit, implicit, or paraphrase?"
      - "Are there claims citing sections that don't support them?"
    expected_decisions: ["Entailment classification", "Citation correction"]
    authority_type: project-spec
    confidence: high
    risk_if_omitted: "Claims appear supported but aren't — false conformance"
    evidence: [SPEC]
    gaps: []

  - id: drift-detection
    name: "Drift Detection (7 Dimensions)"
    trigger: "Scheduled drift check, post-upgrade, dependency change"
    questions:
      - "Has any evidence source become stale?"
      - "Has the project context changed without Book update?"
      "Has the cache become inconsistent?"
    expected_decisions: ["Drift remediation", "Re-scoping"]
    authority_type: project-spec
    confidence: high
    risk_if_omitted: "Book diverges from reality, false conformance"
    evidence: [SPEC]
    gaps: []

# Known gaps
gaps:
  - domain: ddd-methodology
    description: "No formal cross-check between skill content and spec sections"
    severity: high
    status: resolved
    resolution: "Audit completed in dogfooding cycle — 20 gaps found and fixed"
  - domain: technical-writing
    description: "No reference files — all content inline in SKILL.md"
    severity: low

updated_at: "2026-08-30T00:00:00Z"
