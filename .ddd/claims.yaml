# DDD Claim Ledger
# Scope: the external Agent Skills format used by the router skill.
# This is intentionally small; it does not claim whole-repository coverage.

schema_version: 0.1.0

entries:
  - id: C-001
    schema_version: 0.1.0
    statement: "A skill's SKILL.md file contains YAML frontmatter followed by Markdown content."
    rationale: "The router skill must be loadable by Agent Skills-compatible harnesses."
    sources:
      - ref: EL-001#Frontmatter
        authority_domain: skill-format
        entailment: explicit
    claim_kind: api
    impact: medium
    tier: T1
    status: known-and-supported
    constructs: [skills/ddd/SKILL.md#frontmatter]
    validations: []
    exceptions: []

  - id: C-002
    schema_version: 0.1.0
    statement: "The skill name uses lowercase letters, numbers, and hyphens and matches its parent directory."
    rationale: "The router skill name must satisfy the external skill format."
    sources:
      - ref: EL-001#name field
        authority_domain: skill-format
        entailment: explicit
    claim_kind: api
    impact: medium
    tier: T1
    status: known-and-supported
    constructs: [skills/ddd/SKILL.md#name]
    validations: []
    exceptions: []

  - id: C-003
    schema_version: 0.1.0
    statement: "The skill description states what the skill does and when to use it."
    rationale: "The router must be discoverable from its external skill metadata."
    sources:
      - ref: EL-001#description field
        authority_domain: skill-format
        entailment: paraphrase
    claim_kind: api
    impact: medium
    tier: T1
    status: known-and-supported
    constructs: [skills/ddd/SKILL.md#description]
    validations: []
    exceptions: []
