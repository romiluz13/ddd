name: DDD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Run CLI tests
        working-directory: cli
        run: bun test
      - name: Check skill source integrity
        run: bun run cli/bin/ddd.ts doctor
      - name: Check declared DDD scope
        run: bun run cli/bin/ddd.ts sweep --direction both
      - name: Check dogfood assurance boundary
        run: |
          if bun run cli/bin/ddd.ts evaluate-case CASE-002; then
            echo "Expected the historical partial boundary to remain indeterminate"
            exit 1
          fi
          grep -q '"verdict": "INDETERMINATE"' .ddd/reports/CASE-002.assurance.json
